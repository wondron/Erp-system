services:
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data         # 宿主持久化目录
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: kumori
      POSTGRES_PASSWORD: 123456    # 生产请改强密码或用 .env 管理
      POSTGRES_DB: erpdb
      TZ: "Asia/Shanghai"          # 可按需修改时区
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data  # 宿主持久化目录
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL_YIBU: postgresql+asyncpg://kumori:123456@postgres:5432/erpdb
      sqlalchemy_database_asyn_uri: postgresql+asyncpg://kumori:123456@postgres:5432/erpdb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ../backup:/app/backup
    command: >
      bash -lc "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-worker
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
    command: >
      bash -lc "
      rq worker -u redis://redis:6379/0 default --worker-class rq.SimpleWorker -P /app
      "
    restart: unless-stopped